{% extends "base.html" %}

{% block content %}
    <h1>Cadastro</h1>

    <form action="{{ url_for('cadastro') }}" method="post" class="form">
        <label for="username">Usuário</label>
        <input type="text" id="username" name="username" required>

        <label for="password">Senha</label>
        <input type="password" id="password" name="password" required>

        <label for="foto">Foto de perfil (URL)</label>
        <input type="url" id="foto" name="foto"
               placeholder="https://exemplo.com/minha-foto.jpg">

        <label for="bio">Bio</label>
        <textarea id="bio" name="bio" rows="3"
                  placeholder="Conte um pouco sobre você"></textarea>

        <button type="submit" class="btn">Cadastrar</button>
    </form>

    <p>Já tem conta? <a href="{{ url_for('login') }}">Faça login</a></p>
{% endblock %}
