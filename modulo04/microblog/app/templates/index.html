{% extends "base.html" %}

{% block content %}
    <h1>Olá, {{ current_user.username }}!</h1>

    <form action="" method="post">
        <textarea name="body" rows="3" cols="40"
                  placeholder="O que você está pensando?"></textarea>
        <br>
        <button type="submit">Publicar</button>
    </form>

    <hr>

    {% for post in posts %}
        <p>
            <strong>{{ post.author.username }}</strong>: {{ post.body }}<br>
            <small>{{ post.timestamp.strftime('%d/%m/%Y %H:%M') }}</small>
        </p>
    {% else %}
        <p>Nenhuma publicação ainda.</p>
    {% endfor %}
{% endblock %}
